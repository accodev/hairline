name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # From the lockfile in .github/tools/test, pinned by hash. Installed outside the checkout: claude plugin validate counts the plugin's files.
      - name: Install Claude Code
        run: |
          cp .github/tools/test/package.json .github/tools/test/package-lock.json "$RUNNER_TEMP"
          npm ci --prefix "$RUNNER_TEMP" --no-audit --no-fund
          echo "$RUNNER_TEMP/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Validate the plugin and its marketplace
        run: claude plugin validate .

      - name: Run the mod tests
        run: claude plugin test .

      # After the Claude Code steps: node_modules would push the plugin past validate's 4096-file digest.
      - name: Install the Pi extension's dev packages
        run: npm ci

      - name: Type-check the Pi extension
        run: npm run typecheck:pi

      - name: Run the Pi extension tests
        run: npm run test:pi
