name: screenshots

# Renders the README images from tests/screenshots.test.ts and pushes them to the `screenshots`
# branch. That branch is outside the ruleset on `main`, so the push needs no PR and no check run.
on:
  push:
    branches: [main]
  pull_request:
    paths: [hooks/**, tests/screenshots.test.ts, scripts/screenshots.mjs, .github/workflows/screenshots.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

env:
  CLAUDE_CODE_VERSION: 2.1.312
  MAPLE_MONO_VERSION: v7.9
  MAPLE_MONO_SHA256: 8248d6260660be1066b5ebe90d25131582df8383f38db1c284dd1f2dc9d2b46e

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      # The terminal font of the captures the images replace.
      - name: Install Maple Mono NF
        run: |
          curl -fsSL -o maple.zip "https://github.com/subframe7536/maple-font/releases/download/${MAPLE_MONO_VERSION}/MapleMono-NF-unhinted.zip"
          echo "${MAPLE_MONO_SHA256}  maple.zip" | sha256sum --check
          mkdir -p ~/.local/share/fonts/maple
          unzip -q -o maple.zip -d ~/.local/share/fonts/maple
          fc-cache -f

      - name: Render
        env:
          CHROME: google-chrome
        run: node scripts/screenshots.mjs out

      - uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: out

      # One commit, force-pushed: the branch holds only the current images.
      - name: Publish
        if: github.ref == 'refs/heads/main'
        working-directory: out
        run: |
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "docs: render screenshots for ${GITHUB_SHA::7}"
          git push --force -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:screenshots
