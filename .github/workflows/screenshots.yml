name: screenshots

# Renders the README images from tests/screenshots.test.ts and pushes them to the `screenshots`
# branch. That branch is outside the ruleset on `main`, so the push needs no PR and no check run.
on:
  push:
    branches: [main]
  pull_request:
    paths: [claude/**, tests/screenshots.test.ts, scripts/screenshots.ts, .github/workflows/screenshots.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots
  cancel-in-progress: true

env:
  MAPLE_MONO_VERSION: v7.9
  MAPLE_MONO_SHA256: 8248d6260660be1066b5ebe90d25131582df8383f38db1c284dd1f2dc9d2b46e

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Pushes the images to the screenshots branch.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # From the lockfile in .github/tools/test, pinned by hash. Installed outside the checkout: claude plugin validate counts the plugin's files.
      - name: Install Claude Code
        run: |
          cp .github/tools/test/package.json .github/tools/test/package-lock.json "$RUNNER_TEMP"
          npm ci --prefix "$RUNNER_TEMP" --no-audit --no-fund
          echo "$RUNNER_TEMP/node_modules/.bin" >> "$GITHUB_PATH"
      # The terminal font of the captures the images replace.
      - name: Install Maple Mono NF
        run: |
          curl -fsSL -o maple.zip "https://github.com/subframe7536/maple-font/releases/download/${MAPLE_MONO_VERSION}/MapleMono-NF-unhinted.zip"
          echo "${MAPLE_MONO_SHA256}  maple.zip" | sha256sum --check
          mkdir -p ~/.local/share/fonts/maple
          unzip -q -o maple.zip -d ~/.local/share/fonts/maple
          fc-cache -f

      - name: Render
        env:
          CHROME: google-chrome
        run: node --experimental-strip-types scripts/screenshots.ts out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: out

      # One commit, force-pushed: the branch holds only the current images.
      - name: Publish
        if: github.ref == 'refs/heads/main'
        working-directory: out
        run: |
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "docs: render screenshots for ${GITHUB_SHA::7}"
          git push --force -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:screenshots
