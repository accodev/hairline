name: e2e

# Drives real Claude Code and Pi sessions in a pseudo-terminal and checks hairline's two rows before
# and after one turn. A fake model in tests/e2e/kit.ts gives the reply, so no API key is needed.
on:
  push:
    branches: [main]
    paths: [claude/**, pi/**, tests/e2e/**, package.json, package-lock.json, .github/workflows/e2e.yml]
  pull_request:
    paths: [claude/**, pi/**, tests/e2e/**, package.json, package-lock.json, .github/workflows/e2e.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude-code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # From the lockfile in .github/tools/test, pinned by hash. Installed outside the checkout: claude plugin validate counts the plugin's files.
      - name: Install Claude Code
        run: |
          cp .github/tools/test/package.json .github/tools/test/package-lock.json "$RUNNER_TEMP"
          npm ci --prefix "$RUNNER_TEMP" --no-audit --no-fund
          echo "$RUNNER_TEMP/node_modules/.bin" >> "$GITHUB_PATH"
      # node-pty and the headless xterm screen.
      - name: Install the terminal driver
        run: npm ci

      - name: Run
        run: npm run e2e:claude

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-claude-code
          path: tests/e2e/out

  pi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # From the lockfile in .github/tools/test, pinned by hash. Installed outside the checkout: claude plugin validate counts the plugin's files.
      - name: Install Pi
        run: |
          cp .github/tools/test/package.json .github/tools/test/package-lock.json "$RUNNER_TEMP"
          npm ci --prefix "$RUNNER_TEMP" --no-audit --no-fund
          echo "$RUNNER_TEMP/node_modules/.bin" >> "$GITHUB_PATH"
      # The extension imports pi-tui from the repo's node_modules, the run node-pty and xterm.
      - name: Install the dev packages
        run: npm ci

      - name: Run
        run: npm run e2e:pi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-pi
          path: tests/e2e/out
