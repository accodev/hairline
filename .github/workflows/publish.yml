name: publish

# A merge to main that raises the version tags it, releases it on GitHub and stages it on npm.
# One workflow does all three: a tag or release pushed with GITHUB_TOKEN starts no other workflow.
# The file keeps its name because npm trusted publishing trusts this workflow by file name.
on:
  push:
    branches: [main]
    paths: [.claude-plugin/plugin.json, package.json]
  # Retries a run that failed after the tag or the release: each step skips what already exists.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Read the version
        id: version
        run: |
          plugin=$(node -p "require('./.claude-plugin/plugin.json').version")
          npm=$(node -p "require('./package.json').version")
          if [ "$plugin" != "$npm" ]; then
            echo "::error::plugin.json has $plugin and package.json has $npm: bump both"
            exit 1
          fi
          echo "version=$plugin" >> "$GITHUB_OUTPUT"

      # From the lockfile in .github/tools/release, pinned by hash. Installed outside the checkout: claude plugin validate counts the plugin's files.
      - name: Install Claude Code
        run: |
          cp .github/tools/release/package.json .github/tools/release/package-lock.json "$RUNNER_TEMP"
          npm ci --prefix "$RUNNER_TEMP" --no-audit --no-fund
          echo "$RUNNER_TEMP/node_modules/.bin" >> "$GITHUB_PATH"
      # claude plugin tag checks that plugin.json and the marketplace entry agree before it tags.
      - name: Tag unless the tag exists
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="hairline--v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            claude plugin tag --push .
          fi

      - name: Release unless the release exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="hairline--v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists"
          else
            gh release create "$tag" --verify-tag --generate-notes --title "hairline $VERSION"
          fi

  npm:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # npm trusted publishing trades the workflow's OIDC token for a publish token: no NPM_TOKEN secret to leak.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 ships npm 11.19, and staged publishing needs npm 11.15.0 or later.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install the Pi extension's dev packages
        run: npm ci

      - name: Type-check the Pi extension
        run: npm run typecheck:pi

      - name: Run the Pi extension tests
        run: npm run test:pi

      # Staged: the version goes live only once a maintainer approves it with 2FA on npmjs.com.
      - name: Stage unless this version is on npm
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm"
          else
            npm stage publish
          fi
