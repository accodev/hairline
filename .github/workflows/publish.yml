name: publish

on:
  # A merge that raises the plugin's version tags it, releases it and stages it on npm.
  push:
    branches: [main]
  release:
    types: [published]
  # Retries a release whose run failed: a rerun would replay the workflow as it was at the release's tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One file for the release and the stage: npm's trusted publisher names this workflow file, and a
  # release made with GITHUB_TOKEN starts no other workflow.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created }}
    steps:
      - uses: actions/checkout@v5

      - name: Tag and release a new version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./.claude-plugin/plugin.json').version")
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag exists"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  npm:
    needs: release
    # A skipped release job skips this one too, unless always() lets the release and manual runs through.
    if: always() && (github.event_name != 'push' || needs.release.outputs.created == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # npm trusted publishing trades the workflow's OIDC token for a publish token: no NPM_TOKEN secret to leak.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm 11.15.0 or later; Node 22 ships npm 10.
      - name: Update npm
        run: npm install --global npm@^11.15.0

      - name: Install the Pi extension's dev packages
        run: npm ci

      - name: Type-check the Pi extension
        run: npm run typecheck:pi

      - name: Run the Pi extension tests
        run: npm run test:pi

      # Releases follow the Claude plugin's version; the Pi package bumps only when the extension changes.
      # Staged, not published: the version goes live only once a maintainer approves it with 2FA on npmjs.com.
      - name: Stage unless this version is on npm
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm"
          else
            npm stage publish
          fi
